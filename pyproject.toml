[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "pyrespect_freq"
version     = "2.0"
description = "Extract continuous and discrete relaxation spectra from G*(w) data"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["pyrespect_freq"]

[project.urls]
Repository = "https://github.com/shane5ul/pyReSpect-freq"
